# GitHub「Generate release notes」自动生成的分类规则。
# 按合并的 PR 上的 label 归类（无 PR/无 label 时进 “Other Changes”）。
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 New Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🔧 Changed / Dependencies
      labels:
        - changed
        - dependencies
        - chore
    - title: 📝 Documentation
      labels:
        - documentation
        - docs
    - title: Other Changes
      labels:
        - "*"
